name: Déployer Alfred sur GitHub Pages

# GitHub Pages ne fait que servir des fichiers statiques : il ne sait pas
# exécuter `npm run build` tout seul (contrairement à Netlify). Ce workflow
# construit l'app à chaque push sur main, puis publie le résultat (dist/)
# sur GitHub Pages — c'est ce qui permet de se contenter d'un simple push
# (ou d'un clic « Sync » dans GitHub Desktop) pour mettre le site à jour.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Préparer les pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le résultat
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
