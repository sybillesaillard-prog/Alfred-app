<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Alfred</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="icons/icon48.png" width="24" height="24" alt="" />
      <span>Alfred</span>
    </div>

    <div id="statusConnected" class="status hidden">
      <div class="dot"></div>
      <div class="status-text">
        Connecté en tant que<br />
        <strong id="statusEmail"></strong>
      </div>
    </div>
    <button id="logoutBtn" class="btn ghost hidden">Se déconnecter</button>

    <form id="loginForm" class="hidden">
      <div class="field">
        <label for="email">Email Alfred</label>
        <input id="email" type="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password" />
      </div>
      <div id="loginError" class="error"></div>
      <button type="submit" class="btn primary">Se connecter</button>
    </form>

    <p class="hint">
      Une fois connectée, ouvre Gmail ou Google Calendar : des boutons Alfred apparaissent en bas à droite de la page.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
